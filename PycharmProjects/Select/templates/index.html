<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Students</title>
</head>
<body>

<h2>Filter</h2>

<form method="get">
  <select name="faculty">
    <option value="">All</option>
    {% for f in faculties %}
    <option value="{{ f['name'] }}"
            {% if faculty_name == f['name'] %}selected{% endif %}>
    {{ f['name'] }}
    </option>
    {% endfor %}
  </select>
  <button type="submit">Filter</button>
</form>

<hr>

<h2>Add faculty</h2>
<form method="post" action="/add_faculty">
  <input type="text" name="name" placeholder="Name" required>
  <input type="text" name="code" placeholder="Code" required>
  <button type="submit">Add</button>
</form>

<hr>

<h2>Add students</h2>
<form method="post" action="/add_student">
  <input type="text" name="name" placeholder="Name" required>
  <input type="number" name="age" placeholder="Age" required>
  <input type="number" step="0.01" name="ave" placeholder="Avarage" required>
  <select name="faculties_id" required>
    {% for f in faculties %}
    <option value="{{ f['id'] }}">{{ f['name'] }}</option>
    {% endfor %}
  </select>

  <button type="submit">Add</button>
</form>

<hr>

<h2>Students</h2>

<table border="1">
  <tr>
    <th>Name</th>
    <th>Age</th>
    <th>Average</th>
    <th>Faculty</th>
    <th>Delete</th>
  </tr>

  {% for s in students %}
  <tr>
    <td>{{ s['name'] }}</td>
    <td>{{ s['age'] }}</td>
    <td>{{ s['ave'] }}</td>
    <td>{{ s['faculty_name'] }}</td>
    <td>
      <!--окрема форма для кожного студента-->
      <form method ="post"
            action="/delete_student"
            <!--не починати новий рядок-->
            style="display:inline;">
       <!--скрите поле, яке відправляє id студента-->
        <input type="hidden" name="id" value="{{ s['id'] }}">
      <!--кнопка видалення. onclick - підствердження перед видаленням-->
        <button type = "submit" onclick="return confirm('Delete student?')">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>

</body>
</html>
